<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0c0f">
<title>Μέσα στο CERN</title>
<meta name="description" content="Ένα διαδραστικό ταξίδι στη φυσική των σωματιδίων — και στον κώδικα που κρύβεται πίσω της.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Condensed:ital,wght@0,500;0,700;0,800;0,900;1,800&family=Commissioner:wght@400;500;600;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/" } }
</script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="#home" aria-label="Αρχή">
    <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="15"/><circle cx="20" cy="20" r="7"/><circle class="orbit-dot" cx="20" cy="5" r="2"/></svg>
    CERN <b>/</b> Μέσα
  </a>
  <div class="chapter-title" id="chapterTitle"></div>
  <div class="top-actions">
    <button class="icon-btn" id="soundBtn" aria-label="Ήχος">🔊</button>
    <button class="icon-btn" id="menuBtn" aria-label="Όλα τα κεφάλαια">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
  <div class="progress"><i id="progressBar"></i></div>
</header>

<nav class="rail" id="rail" aria-label="Κεφάλαια"></nav>

<main id="chapters"><section class="chapter" id="chapter"><div class="inner" id="inner"></div></section></main>

<nav class="pager" aria-label="Πλοήγηση κεφαλαίων">
  <button class="pager-btn" id="prevBtn" aria-label="Προηγούμενο κεφάλαιο">‹</button>
  <div class="pager-count" id="pagerCount"></div>
  <button class="pager-btn" id="nextBtn" aria-label="Επόμενο κεφάλαιο">›</button>
</nav>

<div class="menu" id="menu" hidden>
  <div class="menu-inner">
    <div class="eyebrow">Όλα τα κεφάλαια</div>
    <div class="menu-list" id="menuList"></div>
    <button class="btn btn-small" id="menuClose">Κλείσιμο</button>
  </div>
</div>

<!-- the single 3D canvas; it is moved into whichever chapter is open -->
<div id="stage"><canvas id="gl"></canvas><div id="stage-labels"></div></div>

<div id="modal" class="modal" hidden><div class="modal-card" id="modal-card"></div></div>
<div id="toasts"></div>
<div id="flash"></div>

<noscript>Η εφαρμογή χρειάζεται JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
